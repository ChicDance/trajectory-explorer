[project]
name = "trajectory-explorer"
version = "0.1.0"
description = "Interactive Streamlit demo for exploring drone/camera trajectory datasets (DLR-UT first), with SMoS safety metrics (TTC/DRAC)."
authors = [
    { name = "Clemens", email = "45458540+ChicDance@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.38",
    "pandas>=2.2",
    "geopandas>=1.0",
    "movingpandas>=0.20",
    "pydeck>=0.9",
    "plotly>=5.24",
    "pyproj>=3.6",
    "tasi>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trajectory_explorer"]
